name: Microservices tests

on:
  push:
    paths:
      - 'microservicios/**'
      - 'docker/ERP/init-all-microservices.sql'
      - 'run_integration_tests.py'
      - '.github/workflows/microservices-tests.yml'
  pull_request:
    paths:
      - 'microservicios/**'
      - 'docker/ERP/init-all-microservices.sql'
      - 'run_integration_tests.py'
      - '.github/workflows/microservices-tests.yml'

jobs:
  test-microservices:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - autenticacion
          - compras
          - finanzas
          - inventario
          - logistica
          - nomina
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        working-directory: ./microservicios/${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        working-directory: ./microservicios/${{ matrix.service }}
        run: pytest -q

  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: transactions_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d transactions_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install integration dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg[binary]
      - name: Run integration tests against postgres service
        env:
          TEST_DATABASE_URL: postgresql://user:password@localhost:5432/transactions_db
        run: python run_integration_tests.py